aid: passes
name: Passes
description: 'Passes is a creator monetization and accelerator platform founded in
  2022 by Lucy Guo and headquartered in Los Angeles. Creators use Passes to build
  direct, paid relationships with their audiences through subscriptions, paid DMs,
  livestreams, one-on-one video calls, merchandise, automated message sequences, and
  instant payouts, while keeping 90% of what they earn. Backed by Bond Capital and
  Multicoin Capital, the company rebranded in 2026 as a creator accelerator. Passes
  does not currently publish a public developer API; this profile captures its real
  public web surface — llms.txt, security.txt, mobile deep-link association files,
  and domain-security posture — harvested by the API Evangelist enrichment pipeline.'
